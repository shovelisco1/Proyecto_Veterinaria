<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h2>🐾 Vet San Marcos</h2>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" style="font-weight: bold; color: #007bff;">Catálogo</a>
            <a href="login.html" class="login">Ingresar</a>
            <a href="#" id="abrir-carrito" class="carrito-btn">
                🛒 Carrito (<span id="contador-carrito">0</span>)
            </a>
        </nav>

    <main class="contenedor-catalogo">

        <div class="filtros" style="text-align: center; margin-bottom: 30px;">
            <button class="btn-filtro activo" data-filtro="todos">Todos</button>
            <button class="btn-filtro" data-filtro="servicios">Servicios Médicos</button>
            <button class="btn-filtro" data-filtro="medicamentos">Medicamentos y Vacunas</button>
        </div>

        
        <div id="grid-productos" class="grid-productos">
        </div>
    </main>

    
    <script src="js/servicios.js"></script>
    <script src="js/medicamentos.js"></script>
    <script src="js/catalogo.js"></script>

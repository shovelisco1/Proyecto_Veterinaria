<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vet San Marcos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>🐾 Vet San Marcos</h2>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html" class="login">Ingresar</a>
        </nav>
    </header>

    <main style="max-width: 500px; margin: 50px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Crear Cuenta</h2>
        
        <form id="form-registro" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label for="nombre" style="font-weight: bold; color: #555;">Nombre completo:</label>
                <input type="text" id="nombre" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div>
                <label for="email" style="font-weight: bold; color: #555;">Correo electrónico:</label>
                <input type="email" id="email" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div>
                <label for="password" style="font-weight: bold; color: #555;">Contraseña:</label>
                <input type="password" id="password" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div>
                <label for="confirmar-password" style="font-weight: bold; color: #555;">Confirmar Contraseña:</label>
                <input type="password" id="confirmar-password" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <button type="submit" style="background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 10px;">Registrarse</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #666;">
            ¿Ya tienes cuenta? <a href="login.html" style="color: #007bff; text-decoration: none; font-weight: bold;">Ingresa aquí</a>
        </p>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>

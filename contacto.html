<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Vet San Marcos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>🐾 Vet San Marcos</h2>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="contacto.html" style="font-weight: bold; color: #007bff;">Contacto</a>
            <a href="login.html" class="login">Ingresar</a>
            <a href="carrito.html" class="carrito-btn">🛒 Carrito</a>
        </nav>
    </header>

    <main style="max-width: 600px; margin: 50px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h1 style="text-align: center; margin-bottom: 10px; color: #333;">Contáctanos</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">¿Tienes dudas? Escríbenos y te responderemos a la brevedad.</p>
        
        <form id="form-contacto" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label for="nombre-contacto" style="font-weight: bold; color: #555;">Nombre completo:</label>
                <input type="text" id="nombre-contacto" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div>
                <label for="email-contacto" style="font-weight: bold; color: #555;">Correo electrónico:</label>
                <input type="email" id="email-contacto" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div>
                <label for="motivo" style="font-weight: bold; color: #555;">Motivo de la consulta:</label>
                <select id="motivo" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; background-color: white;">
                    <option value="">Selecciona una opción...</option>
                    <option value="duda_servicio">Duda sobre un servicio</option>
                    <option value="duda_medicamento">Consulta por medicamentos</option>
                    <option value="reclamo">Reclamo o sugerencia</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div>
                <label for="mensaje" style="font-weight: bold; color: #555;">Mensaje:</label>
                <textarea id="mensaje" rows="5" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; resize: vertical;"></textarea>
            </div>

            <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 10px; transition: 0.2s;">
                Enviar Mensaje ✉️
            </button>
        </form>
    </main>

    <script src="js/contacto.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h2>🐾 Vet San Marcos</h2>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="#">Catálogo</a>
        </nav>
    </header>

    <main class="contenedor-login">
        <form id="formulario-login">
            <h2 style="text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
            
            <div class="grupo-input">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            
            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            </div>

            <p id="mensaje-error" style="color: #dc3545; display: none; font-size: 0.9rem; font-weight: bold;"></p>
            
            <button type="submit">Ingresar</button>
        </form>
    </main>

    <script src="js/login.js"></script>

</body>
</html>
